[project]
name = "careai"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.8,<3.0",
    "supabase>=2.10,<3.0",
    "python-dotenv>=1.0,<2.0",
    "langgraph>=0.2,<2.0",
    "google-genai>=2.3.0,<3.0",
]

[tool.vercel]
entrypoint = "api.main:app"