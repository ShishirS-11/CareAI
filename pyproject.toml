[project]
name = "careai"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "streamlit>=1.40,<2.0",
    "supabase>=2.10,<3.0",
    "python-dotenv>=1.0,<2.0",
    "pydantic>=2.8,<3.0",
    "langgraph>=0.2,<2.0",
    "google-genai>=2.3.0,<3.0",
    "streamlit-cookies-manager-v2==0.3.1",
    "pypdf>=5.0,<7.0",
    "PyMuPDF>=1.24,<2.0",
    "Pillow>=10.0,<13.0",
    "pytesseract>=0.3.13,<1.0",
    "python-docx>=1.1,<2.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[tool.vercel]
entrypoint = "api.main:app"